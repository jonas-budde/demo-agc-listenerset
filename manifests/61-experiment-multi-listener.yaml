# Experiment: a second listener and route in team-a's ListenerSet. Does the ListenerSet-level
# WAF policy (60-experiment) also protect the second hostname?
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: team-a-listeners
  namespace: team-a
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: shared-public
    namespace: platform
  listeners:
    - name: team-a-http
      hostname: team-a.example.com
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces: { from: Same }
    - name: team-a2-http
      hostname: team-a2.example.com
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces: { from: Same }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: team-a2-route
  namespace: team-a
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: team-a-listeners
      sectionName: team-a2-http
  hostnames: ["team-a2.example.com"]
  rules:
    - backendRefs:
        - name: backend
          port: 80
