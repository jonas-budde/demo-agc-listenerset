# Team B also exposes an internal hostname through the private Gateway (private frontend).
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: team-b-internal
  namespace: team-b
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: shared-private
    namespace: platform
  listeners:
    - name: team-b-internal-http
      hostname: team-b.internal.example.com
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces: { from: Same }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: team-b-internal-route
  namespace: team-b
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: team-b-internal
      sectionName: team-b-internal-http
  hostnames: ["team-b.internal.example.com"]
  rules:
    - backendRefs:
        - name: backend
          port: 80
