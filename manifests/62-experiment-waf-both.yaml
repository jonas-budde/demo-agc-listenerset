# Experiment: WAF policy on the ListenerSet (60-experiment, blocks /blocked-a) AND a different
# policy on team-a's route. The route policy uses team-b's WAF policy (blocks /blocked-b) so the
# winner is visible. WAF_TEAM_B_ID is substituted from `tofu output waf_policy_ids`.
apiVersion: alb.networking.azure.io/v1
kind: WebApplicationFirewallPolicy
metadata:
  name: waf-team-a-route-other
  namespace: team-a
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: team-a-route
    namespace: team-a
  webApplicationFirewall:
    id: WAF_TEAM_B_ID
