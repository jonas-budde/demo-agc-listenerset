apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: team-a-wildcard, namespace: team-a }
spec:
  parentRefs: [{ group: gateway.networking.k8s.io, kind: ListenerSet, name: team-a-listeners }]
  hostnames: ["*.team-a.example.com"]
  rules: [{ backendRefs: [{ name: backend, port: 80 }] }]
