apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: team-a-listeners
  namespace: team-a
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: shared-public
    namespace: platform
  listeners:
    - name: apex
      hostname: team-a.example.com
      port: 80
      protocol: HTTP
    - name: api
      hostname: api.team-a.example.com
      port: 80
      protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: team-a-route
  namespace: team-a
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: team-a-listeners
      sectionName: api
  hostnames: ["api.team-a.example.com"]
  rules:
    - backendRefs:
        - name: backend
          port: 80
